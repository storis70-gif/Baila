      - name: Prepara Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepara Android SDK
        uses: android-actions/setup-android@v3
      - name: Compila nuova APK Baila Latin
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Verifica APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Pubblica APK come file scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: Baila-Latin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Pubblica APK nella pagina Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          file='android/app/build/outputs/apk/debug/app-debug.apk#Baila_Latin.apk'
          if gh release view baila-latin-v1.0 >/dev/null 2>&1; then
            gh release upload baila-latin-v1.0 "$file" --clobber
          else
            gh release create baila-latin-v1.0 "$file" --title 'Baila Latin - App Android' --notes 'Seconda app indipendente dalla Baila Dance School. Icona Baila Latin rossa. Pad 120 tasti MP3, rinomina e controlli +10 e -10 secondi.'
          fi
