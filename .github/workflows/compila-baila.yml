name: Crea APK Baila2
on: [push, workflow_dispatch]
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estrai progetto
        run: unzip -q Baila_Android_Progetto.zip -d android
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - uses: android-actions/setup-android@v3
      - name: Crea app Android
        run: gradle -p android --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Baila-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rendi APK disponibile come download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          gh release create v1.0.0-prova "$apk#Baila_Dance_School.apk" --title "Baila Dance School - Prova Android" --notes "Prima versione Android di prova. Importare i propri file audio nell'app." || gh release upload v1.0.0-prova "$apk#Baila_Dance_School.apk" --clobber
