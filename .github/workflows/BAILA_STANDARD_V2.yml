name: "Baila Standard V2 - nomi MP3 corretti"

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/BAILA_STANDARD_V2.yml'
      - 'Baila_Latin_Progetto_Android.zip'

permissions:
  contents: write

jobs:
  build-standard-v2:
    runs-on: ubuntu-24.04
    steps:
      - name: Prendi il progetto Baila senza modificare Baila Latin
        uses: actions/checkout@v4

      - name: Crea Baila Standard V2 con nomi separati
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android
          unzip -q Baila_Latin_Progetto_Android.zip -d android
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('android/app')
          gradle = root / 'build.gradle'
          source = gradle.read_text(encoding='utf-8')
          pattern = r'(\bapplicationId\s*=?\s*["\x27])it\.bailadanceschool\.latin(["\x27])'
          converted, count = re.subn(pattern, r'\g<1>it.bailadanceschool.standard\g<2>', source)
          if count != 1:
              raise SystemExit('Sicurezza: applicationId Latin non trovato esattamente una volta.')
          gradle.write_text(converted, encoding='utf-8')

          labels = root / 'src/main/res/values/strings.xml'
          original_labels = labels.read_text(encoding='utf-8')
          if 'Baila Latin' not in original_labels:
              raise SystemExit('Il nome originale Baila Latin non è presente in strings.xml')
          labels.write_text(original_labels.replace('Baila Latin', 'Baila Standard'), encoding='utf-8')

          html = root / 'src/main/assets/index.html'
          page = html.read_text(encoding='utf-8')
          page = page.replace('Baila Latin', 'Baila Standard').replace('BAILA LATIN', 'BAILA STANDARD').replace('PAD LATIN', 'PAD STANDARD')

          def replace_once(old, new, meaning):
              global page
              occurrences = page.count(old)
              if occurrences != 1:
                  raise SystemExit(f'{meaning}: trovate {occurrences} occorrenze, attesa 1. Il progetto originale è cambiato.')
              page = page.replace(old, new, 1)

          # La nuova associazione MP3 assegna SEMPRE al tasto il nome del file
          # senza estensione, senza toccare il file reale.
          replace_once(
              "if(pd.name==='Tasto '+(p+1))pd.name=file.name.replace(/\\.[^.]+$/,'').slice(0,110);",
              "pd.name=file.name.replace(/\\.[^.]+$/,'');",
              'Rinomina automatica del tasto')

          # La rinomina manuale del tasto modifica solo pd.name;
          # pd.fileName conserva sempre il nome vero del file MP3.
          replace_once(
              'async function playPad(c,p){const pd=slot(c,p);',
              "async function playPad(c,p){const pd=slot(c,p);const songName=pd.fileName?pd.fileName.replace(/\\.[^.]+$/,''):pd.name;",
              'Lettura del nome originale MP3')
          replace_once(
              "showStatus('CARICAMENTO '+pd.name)",
              "showStatus('CARICAMENTO '+songName)",
              'Stato di caricamento')
          replace_once(
              "$('track').textContent=state.columns[c].name+' · '+pd.name;",
              "$('track').textContent=state.columns[c].name+' · '+songName;",
              'Riga del brano in riproduzione')
          replace_once(
              "showStatus('IN RIPRODUZIONE • '+pd.name)",
              "showStatus('IN RIPRODUZIONE • '+songName)",
              'Stato di riproduzione')

          html.write_text(page, encoding='utf-8')
          print('OK: Baila Standard V2, pulsanti rinominabili, nomi originali mostrati durante la riproduzione.')
          PY

      - name: Prepara Python per mantenere l'icona originale Baila Standard
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Usa l'icona Baila Standard originale con ballerini e font scuola
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re, base64, io
          # Ricava l'immagine approvata dal workflow Standard precedente.
          workflow = Path('.github/workflows/BAILA_STANDARD_APK.yml').read_text(encoding='utf-8')
          found = re.search(r"\bdata='''(.*?)'''", workflow, re.DOTALL)
          if not found:
              raise SystemExit('Icona Baila Standard originale non trovata nel workflow precedente.')
          encoded = ''.join(found.group(1).split())
          picture = Image.open(io.BytesIO(base64.b64decode(encoded, validate=True))).convert('RGBA')
          resource = Path('android/app/src/main/res')
          for density, size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder = resource / ('mipmap-' + density)
              folder.mkdir(parents=True, exist_ok=True)
              pic = picture.resize((size, size), Image.Resampling.LANCZOS).convert('RGB')
              pic.save(folder / 'ic_launcher.png')
              pic.save(folder / 'ic_launcher_round.png')
          adaptive = resource / 'mipmap-anydpi-v26'
          if adaptive.exists():
              for filename in ('ic_launcher.xml', 'ic_launcher_round.xml'):
                  (adaptive / filename).unlink(missing_ok=True)
          print('Icona Baila Standard originale conservata.')
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compila l'APK Android Standard V2
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Verifica nome e identificativo dell'app
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee /tmp/baila_standard_v2.txt
          grep -q "package: name='it.bailadanceschool.standard'" /tmp/baila_standard_v2.txt
          grep -q "application-label:'Baila Standard'" /tmp/baila_standard_v2.txt
          cp "$apk" Baila_Standard_V2.apk

      - name: Rendi scaricabile Baila Standard V2
        uses: actions/upload-artifact@v4
        with:
          name: BAILA-STANDARD-V2-APK
          path: Baila_Standard_V2.apk
          if-no-files-found: error

      - name: Pubblica APK in GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view baila-standard-v2.0 >/dev/null 2>&1; then
            gh release upload baila-standard-v2.0 Baila_Standard_V2.apk --clobber
          else
            gh release create baila-standard-v2.0 Baila_Standard_V2.apk --title 'Baila Standard V2 - nomi MP3 corretti' --notes 'Tasti rinominabili: assegnando un nuovo MP3 il tasto assume il nome originale del brano, e la barra di riproduzione mostra sempre il nome del brano anche dopo una rinomina manuale.'
          fi
