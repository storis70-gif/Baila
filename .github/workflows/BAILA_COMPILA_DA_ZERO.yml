      - name: Estrai il progetto nuovo
        run: |
          mkdir -p source
          base64 --decode /tmp/baila_code.b64 > /tmp/baila_source.zip
          unzip -q /tmp/baila_source.zip -d source
          test -f source/app/src/main/AndroidManifest.xml
          echo 'Progetto nuovo estratto.'
      - name: Prepara Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepara Android SDK
        uses: android-actions/setup-android@v3
      - name: Installa la piattaforma Android
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compila Baila NUOVA v2 con la foto scelta
        run: gradle -p source --no-daemon :app:assembleDebug
      - name: Salva nuova APK
        uses: actions/upload-artifact@v4
        with:
          name: BAILA-NUOVA-2-ICONA-ROSSA
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Pubblica file per installazione
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk='source/app/build/outputs/apk/debug/app-debug.apk#Baila_Dance_School_NUOVA_2.apk'
          if gh release view baila-nuova-2 >/dev/null 2>&1; then
            gh release upload baila-nuova-2 "$apk" --clobber
          else
            gh release create baila-nuova-2 "$apk" --title 'Baila Dance School NUOVA 2 - Icona Corretta' --notes 'Nuovo progetto indipendente dai vecchi ZIP. Non cancella la vecchia app.'
          fi
