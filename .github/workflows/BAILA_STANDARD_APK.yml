      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepara Android SDK come nel workflow Latin funzionante
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER" || { echo 'sdkmanager non trovato'; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compila APK Standard
        run: gradle -p android --no-daemon :app:assembleDebug

      - name: Controlla identificativo e nome dell'APK
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee /tmp/standard-info.txt
          grep -q "package: name='it.bailadanceschool.standard'" /tmp/standard-info.txt
          grep -q "application-label:'Baila Standard'" /tmp/standard-info.txt
          cp "$apk" Baila_Standard.apk

      - name: Salva il file installabile
        uses: actions/upload-artifact@v4
        with:
          name: BAILA-STANDARD-APK
          path: Baila_Standard.apk
          if-no-files-found: error

      - name: Metti Baila Standard in Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view baila-standard-v1.0 >/dev/null 2>&1; then
            gh release upload baila-standard-v1.0 Baila_Standard.apk --clobber
          else
            gh release create baila-standard-v1.0 Baila_Standard.apk --title 'Baila Standard - APK Android' --notes 'App Baila Standard autonoma, installabile accanto a Baila Latin (applicationId distinto).'
          fi
