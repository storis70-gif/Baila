name: Baila Standard - APK indipendente

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/BAILA_STANDARD_APK.yml'
      - 'Baila_Latin_Progetto_Android.zip'

permissions:
  contents: write

jobs:
  build-standard:
    runs-on: ubuntu-24.04
    steps:
      - name: Prendi il progetto originale Baila Latin
        uses: actions/checkout@v4

      - name: Copia progetto Latin per Standard senza toccare Latin
        shell: bash
        run: |
          mkdir -p android
          unzip -q Baila_Latin_Progetto_Android.zip -d android
          test -f android/app/build.gradle
          test -f android/app/src/main/res/values/strings.xml
          test -f android/app/src/main/assets/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle=Path('android/app/build.gradle')
          old=gradle.read_text(encoding='utf-8')
          pattern=r'(\bapplicationId\s*=?\s*["\x27])it\.bailadanceschool\.latin(["\x27])'
          new,n=re.subn(pattern,r'\g<1>it.bailadanceschool.standard\g<2>',old)
          if n!=1:
              raise SystemExit('applicationId Latin non trovato una volta sola: stop per evitare errori')
          gradle.write_text(new,encoding='utf-8')
          # Solo applicationId cambia: namespace e classi Java rimangono invariati.
          labels=Path('android/app/src/main/res/values/strings.xml')
          s=labels.read_text(encoding='utf-8')
          if 'Baila Latin' not in s:
              raise SystemExit('Nome Baila Latin mancante dalle stringhe')
          labels.write_text(s.replace('Baila Latin','Baila Standard'),encoding='utf-8')
          html=Path('android/app/src/main/assets/index.html')
          h=html.read_text(encoding='utf-8')
          html.write_text(h.replace('Baila Latin','Baila Standard').replace('BAILA LATIN','BAILA STANDARD').replace('PAD LATIN','PAD STANDARD'),encoding='utf-8')
          print('Nuovo pacchetto: it.bailadanceschool.standard; originale intatto')
          PY

      - name: Prepara Python per icona Baila Standard
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

